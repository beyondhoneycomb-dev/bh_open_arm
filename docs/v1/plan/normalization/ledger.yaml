        section: "3.9"
        quote: "제어 루프 스레드는 RT 승격(SCHED_FIFO) + mlockall 대상"
        req: NFR-GUI-008
    contract: "CTR-WS@v2"
    rationale: >-
      RT 승격을 범위에서 제외한다. root 권한을 요구하고 우선순위 역전으로 시스템 전체를
      멈출 수 있는데, GIL 이 병목인 한 얻는 것이 없다. 나머지 세 항목(제어 루프와
      WS/인코딩 분리, 인코딩이 제어 루프를 막지 않을 것, 사이클 타임 상시 계측)은 그대로
