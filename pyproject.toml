[project]
name = "bh-open-arm"
version = "0.0.0"
description = "OpenArm v2.0 physical-AI platform — Wave -2 BOOT execution bootstrap"
# 3.12 floor: the pinned LeRobot (deps/lerobot.pin, [robot] group) requires >=3.12,
# and both the dev venv and CI already run 3.12. The core plan-machine works on 3.12.
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    # Exact, and equal to the `rev:` in .pre-commit-config.yaml — tests/env03
    # asserts they match. A formatter used as a merge gate is a style oracle, and a
    # floating spec lets CI resolve a newer oracle than the pre-commit hook that
    # formatted the tree, so a correctly-formatted commit is rejected by a
    # disagreement no source file records.
    "ruff==0.15.22",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
    # The gate runs the suite across cores. Serial, it is ~360 s on this machine and one core of
    # twenty-four is busy; `-n auto --dist loadfile` is ~80 s. `loadfile` rather than the default
    # per-test distribution because module- and session-scoped fixtures are shared within a file
    # and splitting a file across workers rebuilds them per worker — `tests/boot02` alone loads the
    # 3 MB registry once per session that way.
    "pytest-xdist>=3.6",
]
# WP-ENV-01/04: everything `backend/`, `sim/` and `packages/` import. Kept OUT of the
# core `dependencies` so the plan-machine (registry/, ops/, dashboard/) — and
# `registry.check` — stay light: those three trees import only pyyaml, jsonschema and
# mcap, verified by AST scan over every `*.py` in them.
#
# LeRobot is pinned by commit SHA (deps/lerobot.pin, 16 §3.1): a bare `lerobot==0.6.x`
# spec is refused by deps/phantom.py. `av` is held below 14 because lerobot 0.6.0 uses
# the pre-14 `av.option` API.
#
# `openarm_control` is pinned EXACTLY, not floored: 02b §「openarm_control IK 채택」
# records that it has one release and ships no test directory, so the version pin is the
# only defence against an upstream change. It carries mink, mujoco, numpy, daqp and
# openarm_mujoco as its own requirements, which is why the IK stack needs no separate
# entry here. `openarm_driver` is absent on purpose — 01 FR-SYS-010 forbids it on the
# canonical path (it opens its own CAN socket and double-binds with LeRobot's
# DamiaoMotorsBus), and backend/can/bind/staticcheck.py fails the build on its import.
#
# opencv ships headless: no tree imports a GUI window function, and the GUI build pulls
# X11 into a container that has no display.
robot = [
    "lerobot @ git+https://github.com/huggingface/lerobot@30da8e687a6dfc617fcd94afc367ac7071c376ce",
    "python-can>=4.6",
    "datasets>=2.19",
    "grpcio>=1.60",
    "av>=12,<14",
    # WP-OPS-05 telemetry (14 FR-OPS-006): MCAP is the system-timeseries format (mcap
    # python lib directly, no rosbag2). Small and pure-python, but a product-runtime dep
    # ops/telemetry imports eagerly — kept out of core so registry.check stays light.
    "mcap>=1.4",
    # IK and its physics model (01 §2.9). Brings mink, mujoco, numpy, daqp, openarm_mujoco.
    "openarm_control==0.1.0",
    # The four below arrive through openarm_control as well, and are named anyway because this
    # project imports them DIRECTLY — numpy in 109 files under backend/ and 11 under sim/,
    # mujoco in 50, mink and openarm_mujoco in one each. A direct import resting on someone
    # else's requirement list breaks the day that list changes, with no line here to amend.
    # registry.env.declared_imports fails the build on an import no group covers.
    "numpy>=2.2",
    "mujoco>=3.10",
    "mink>=1.1",
    "openarm_mujoco>=2.0",
    "scipy>=1.15",
    "pandas>=2.2",
    "pyarrow>=17",
    "opencv-python-headless>=4.10",
    "pillow>=10",
    # WP-G-00's backend half (13 FR-GUI-004): the runtime_config canon and the REST surface the
    # browser reads it through. pydantic is named although FastAPI already requires it, because
    # backend/config/model.py imports it directly and a direct import resting on someone else's
    # requirement list breaks the day that list changes. httpx is what `fastapi.testclient`
    # drives the routes with — the routes are exercised in-process, so no port is ever bound.
    "fastapi>=0.115",
    "pydantic>=2.9",
    "httpx>=0.27",
    # `oa-serve`'s ASGI server (13 §2.7, FR-GUI-006). FastAPI builds the app and binds nothing, so
    # the one process that shares a port between the SPA bundle, REST and the WebSocket needs a
    # server underneath it. Here rather than in core `dependencies` for exactly the reason FastAPI
    # is: `registry.check` validates a plan and must not drag a web server in to do it.
    "uvicorn>=0.30",
    # Named for one import that has no FastAPI equivalent: `starlette.routing.WebSocketRoute`,
    # the base class `CG-G-01a` counts to prove the app carries exactly one realtime endpoint.
    # FastAPI exposes only its own `APIWebSocketRoute` subclass, and counting that would stop
    # seeing a websocket route added through starlette directly — narrowing the check to the
    # case nobody was worried about. Every other symbol comes from `fastapi`, which re-exports
    # them.
    "starlette>=0.40",
]

[project.scripts]
oa-env = "registry.env.cli:main"
oa-serve = "backend.config.serve:main"
# The PG-CAM-001 capture. A console script rather than a one-off, because that gate goes
# SUPERSEDED whenever the camera set, the rig profile or the USB topology changes.
oa-camcap = "backend.camera.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# A console script gets the interpreter's bin directory on `sys.path`, never the working
# directory, so a tree an entry point reaches and this list omits raises ModuleNotFoundError from
# every directory INCLUDING the repository root. Running from the checkout does not paper over it,
# which is why nothing caught the omission of `contracts` until `oa-serve` was started for real.
#
# The list is therefore the whole import closure of the entry points, not the trees they are
# spelled with: `backend` reaches `contracts` (shared types), `packages` (the LeRobot plugin),
# `deps` and `sim`. Naming only the obvious three is what broke it.
#
# `contracts`, `packages` and `sim` carry no top-level `__init__.py`. `packages.find` discovers
# namespace packages by default, so they are found — but a `find` that ever gets `namespaces =
# false` drops all three silently, and the failure lands at import time in the served process.
include = [
    "registry*",
    "ops*",
    "backend*",
    "contracts*",
    "packages*",
    "sim*",
    "deps*",
    "targets*",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "PTH", "RET", "ARG", "C4"]
# PLAN-BOOT: fixtures deliberately contain malformed records; they are data, not logic.
exclude = ["registry/fixtures/**"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
exclude = ["registry/fixtures/", "registry/build/"]

[[tool.mypy.overrides]]
module = ["jsonschema.*"]
ignore_missing_imports = true

# The robot/sim stack ships no type stubs (no py.typed). registry.env.upstream
# introspects it inside its predicates; mypy analyses those imports statically and
# would otherwise fail the light lane, where the stack is not installed at all.
[[tool.mypy.overrides]]
module = [
    "lerobot.*",
    "openarm_control.*",
    "openarm_mujoco.*",
    "mujoco.*",
    "mink.*",
    "can.*",
    "torch.*",
    "datasets.*",
    "grpc.*",
]
ignore_missing_imports = true

# mcap ships py.typed, so mypy walks into the installed package and hits a package-vs-__init__
# resolution conflict there ("source file found twice"), a defect in the library's own layout,
# not ours. The MCAP writer (WP-OPS-05, 14 FR-OPS-006) imports it directly; skipping mcap's
# internal sources clears the conflict without weakening any check on our own code.
[[tool.mypy.overrides]]
module = ["mcap.*"]
follow_imports = "skip"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "fixture_corpus: exercises the violation/pass fixture corpora required by WP-BOOT-03",
    # A test whose verdict is a measured wall-clock duration. It has to be the only thing this
    # machine is doing, so `scripts/gates.sh` runs these in their own serial lane after the
    # parallel one. The marker is not a speed hint: under `-n auto` these fail on a healthy tree,
    # because the number they assert on is the number the contention changed.
    "serial: asserts on measured wall-clock time; must not share the machine with other workers",
]
