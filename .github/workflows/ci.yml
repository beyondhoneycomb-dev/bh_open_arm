name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # registry/check.py resolves spine_ref against the commit, so the
          # graph checks need real history rather than a shallow clone.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
      - run: uv venv --python 3.12
      - run: uv pip install -e ".[dev]"

      # Every Python tree in the repository, not just the plan machine. backend/
      # alone is ~100k lines of the product runtime; checking only registry/ops/
      # dashboard left it enforced by nothing but a pre-commit hook a contributor
      # can skip, so a lint regression there reaches main with CI green.
      - name: Lint
        run: uv run ruff check registry ops dashboard tests backend contracts sim packages ownership targets deps

      - name: Format check
        run: uv run ruff format --check registry ops dashboard tests backend contracts sim packages ownership targets deps

      # NOT the full tree: mypy --strict currently reports 266 errors across 79
      # files under backend/contracts/sim, and backend/ needs --explicit-package-bases
      # before it resolves at all (two directories both provide a `stats` module).
      # Widening this step is its own work package, not a line edit here.
      - name: Types
        run: uv run mypy registry ops dashboard

      - name: Tests
        run: uv run pytest -q

  # The GUI is 13 screens with its own vitest suite and strict tsconfig. Nothing
  # ran either, so a broken screen or a contract drift on the TypeScript side of
  # the WebSocket was invisible to every gate.
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci

      - name: Types
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint .

      # Several suites read contracts/ and docs/v1/spec/ from the repository root,
      # so this job needs the whole checkout rather than only frontend/.
      - name: Tests
        run: npx vitest run

  registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - run: uv venv --python 3.12
      - run: uv pip install -e ".[dev]"

      - name: Registry matches the corpus
        # --check re-seeds from docs/ and fails if the committed registry drifted.
        # Without this the registry silently stops describing the plan it indexes.
        run: uv run python -m registry.ingest.cli --check

      - name: Generated indexes are not hand-edited
        run: uv run python -m registry.generate.cli --check

      - name: BOOT band acceptance gate
        # Every rule runs; JUDGE_RANGE decides which ones the exit status counts.
        # CI-18 is built but excluded from judgement on purpose: its predicate
        # references this gate, so judging it would make the gate reference
        # itself (02a §-2.2, registry/checks/__init__.py JUDGE_EXCLUDED).
        run: uv run python -m registry.check --all
